; =============================================================================
; 99-app-prod.ini — ajustes de runtime para el espejo.
;
; OJO: estos valores NO estan fijados en migrate/setup-server.sh, o sea que en
; el server real se estan usando los defaults del paquete de Sury. Si en algun
; momento tuneas php.ini en produccion, replicalo aca.
; =============================================================================
memory_limit=512M
max_execution_time=300
expose_php=Off

; Octane arranca los workers desde CLI; el limite de subida solo aplica a
; requests que pasan por FrankenPHP.
upload_max_filesize=32M
post_max_size=32M

date.timezone=America/Asuncion
