; =============================================================================
; 99-opcache-prod.ini — copia textual del bloque OPcache que
; migrate/setup-server.sh escribe en /etc/php/8.4/cli/conf.d/ del server real.
;
; Si estos valores no coinciden con produccion, cualquier numero de latencia
; que salga del espejo es inservible. validate_timestamps=0 es el mas critico:
; sin el, PHP hace stat() de cada archivo en cada request.
; =============================================================================
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.revalidate_freq=0
opcache.validate_timestamps=0
opcache.save_comments=1
